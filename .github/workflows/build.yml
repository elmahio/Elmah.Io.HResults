name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: windows-2025
    permissions:
      id-token: write

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Test
      run: dotnet test --no-restore --verbosity normal
    - name: Pack
      run: dotnet pack --configuration Release src/Elmah.Io.HResults/Elmah.Io.HResults.csproj /p:Version=1.0.${{ github.run_number }}
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}
      if: ${{ github.event_name == 'push' }}
    - name: Push
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push src/Elmah.Io.HResults/bin/Release/Elmah.Io.HResults.1.0.${{ github.run_number }}.nupkg --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
      if: ${{ github.event_name == 'push' }}
